spring:
  application:
    name: analyzer
  config:
    import: "optional:configserver:http://config-server:9091"
  cloud:
    config:
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 6000
      discovery:
        enabled: true
        service-id: config-server

kafka:
  bootstrap-servers: kafka:29092
  user-actions-consumer:
    group-id: analyzer-user-actions
    topic: stats-service.user-actions.v1
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: ru.practicum.AvroDeserializer
  events-similarity-consumer:
    group-id: analyzer-events-sim
    topic: stats-service.events-similarity.v1
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: ru.practicum.AvroDeserializer

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: "${spring.application.name}:${random.value}"
    lease-renewal-interval-in-seconds: 10
server:
  port: 0